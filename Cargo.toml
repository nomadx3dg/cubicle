[package]
name = "cubicle"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Interactive 3D renderer for your terminal. Spin 3D models as ASCII art."
license = "MIT"
repository = "https://github.com/nomadx3dg/cubicle"
readme = "README.md"
keywords = ["ascii", "3d", "terminal", "rasteriser", "obj"]
categories = ["command-line-utilities", "rendering"]

[lib]
name = "cubicle"
path = "src/lib.rs"

[[bin]]
name = "cubicle"
path = "src/main.rs"

[dependencies]
crossterm = "0.27"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
